name: Pipeline nacional
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
concurrency:
  group: pipeline-national
  cancel-in-progress: false
jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Validar configuração
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          test -n "$MAP_KEY" && test -n "$DATABASE_URL_DIRECT"
      - name: Coletar, harmonizar e atualizar calendário nacional
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: python -m pipeline update
