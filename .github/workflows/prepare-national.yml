name: Preparar banco nacional
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-national
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Verificar conexão configurada
        run: |
          if [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::error::Configure o secret DATABASE_URL_DIRECT com a conexão direta do banco existente."
            exit 1
          fi
      - name: Instalar dependências
        run: pip install -r backend/requirements.txt -r pipeline/requirements.txt
      - name: Aplicar migrações
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Importar Brasil e UFs (snapshot oficial IBGE)
        run: python -m pipeline boundaries
