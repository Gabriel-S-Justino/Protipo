name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install deps
        run: pip install -r backend/requirements.txt -r pipeline/requirements.txt
      - name: Run tests (sem banco)
        run: python -m pytest -q backend/tests pipeline/tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Build (valida o build de deploy)
        run: npm --prefix frontend run build

  deploy-build-preview:
    # Teste de build do deploy (frontend + function) via Vercel CLI — exige secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-build]
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm i -g vercel
      - name: Vercel build
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
