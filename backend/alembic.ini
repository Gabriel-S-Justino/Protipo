[alembic]
# %(here)s = diretório deste arquivo (backend/) — funciona de qualquer cwd:
#   repo root:  npm run db:migrate      → alembic -c backend/alembic.ini upgrade head
#   dentro do bundle Vercel: backend/app/api/admin.py usa os mesmos arquivos
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
# DATABASE_URL da MIGRATION vem do AMBIENTE (direta, NUNCA pooled):
#   DATABASE_URL_DIRECT  (manual) | DATABASE_URL_UNPOOLED | POSTGRES_URL_NON_POOLING
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
